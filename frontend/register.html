<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register your household - Waste Segregation</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="topbar"><nav id="navbar"></nav></header>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="card">
      <div class="auth-logo"><span class="brand-mark" style="width:48px;height:48px;font-size:1.4rem;">S</span></div>
      <h2 class="auth-title text-center">Register your household</h2>
      <p class="auth-sub">You'll get a unique household ID and QR tag instantly.</p>

      <div id="reg-alert"></div>

      <form id="reg-form">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" required />
        </div>
        <div class="field">
          <label for="contact">Phone or email (used to log in)</label>
          <input type="text" id="contact" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" minlength="6" required />
          <div class="field-hint">At least 6 characters.</div>
        </div>
        <div class="field">
          <label for="address">Address</label>
          <input type="text" id="address" placeholder="House no., street" required />
        </div>
        <div class="field">
          <label for="ward_id">Ward</label>
          <select id="ward_id" required>
            <option value="">Loading wards...</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="reg-btn">Create household account</button>
      </form>

      <p class="text-center small mt-2">
        Already registered? <a href="/login.html">Log in</a>
      </p>
    </div>
  </div>
</main>

<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script>
renderNavbar();
if (WasteSegAuth.isLoggedIn()) window.location.href = WasteSegAuth.homeForRole();

(async () => {
  try {
    const res = await WasteSegAPI.get("/api/wards");
    const sel = document.getElementById("ward_id");
    sel.innerHTML = res.wards.map(w => `<option value="${w.id}">${w.ward_name}</option>`).join("");
  } catch (err) {
    document.getElementById("ward_id").innerHTML = `<option value="">Could not load wards</option>`;
  }
})();

document.getElementById("reg-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById("reg-alert");
  const btn = document.getElementById("reg-btn");
  alertBox.innerHTML = "";

  const payload = {
    name: document.getElementById("name").value.trim(),
    contact: document.getElementById("contact").value.trim(),
    password: document.getElementById("password").value,
    address: document.getElementById("address").value.trim(),
    ward_id: document.getElementById("ward_id").value,
  };

  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span> Creating account...';
  try {
    const res = await WasteSegAPI.post("/api/auth/register", payload);
    WasteSegAuth.save(res);
    alertBox.innerHTML = `<div class="alert alert-success">Welcome! Your household ID is ${res.profile.household_code}. Redirecting...</div>`;
    setTimeout(() => { window.location.href = WasteSegAuth.homeForRole("HOUSEHOLD"); }, 900);
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    btn.disabled = false;
    btn.innerHTML = "Create household account";
  }
});
</script>
</body>
</html>
